spring:
  application:
    name: areatherm-backend
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  mail:
    # SMTP via a Gmail account + an "app password" (myaccount.google.com/apppasswords)
    # -- never a real Google account password. Both env vars are required for
    # real sending; left unset, EmailService's sends fail (logged, not thrown)
    # and registration/login/verification still work normally otherwise.
    host: smtp.gmail.com
    port: 587
    username: ${AREATHERM_MAIL_USERNAME:}
    password: ${AREATHERM_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

areatherm:
  jwt:
    # Local/dev-only default secret -- override via AREATHERM_JWT_SECRET env var
    # for anything beyond a laptop. Never committed as a real secret.
    secret: ${AREATHERM_JWT_SECRET:dev-only-secret-change-me-areatherm-backend-local-use-only-0123456789}
    expiration-minutes: 120
  cors:
    # Browser origin(s) allowed to call this API cross-origin -- the
    # standalone frontend's dev-server origin today.
    allowed-origins:
      - http://localhost:8743
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
  mail:
    # "From" address on outgoing mail -- normally the same as spring.mail.username above.
    from: ${AREATHERM_MAIL_USERNAME:}
    verification-code-expiry-minutes: 15
  era5:
    # Optional, opt-in (frontend toggle default OFF): real ERA5 reanalysis
    # data from the Copernicus Climate Data Store, as a higher-accuracy
    # alternative to the always-on Open-Meteo/NASA POWER sources. Left
    # unset, era5/ fails closed (ClimateController reports the feature as
    # unavailable) and every other feature works normally. Register at
    # https://cds.climate.copernicus.eu, then set the env var below to your
    # personal API key from your CDS profile page -- never commit a real
    # key here.
    api-url: https://cds.climate.copernicus.eu/api
    api-key: ${AREATHERM_ERA5_API_KEY:}
    poll-interval-ms: 15000
    # CDS queue time is real and can run well past 5 minutes before a job
    # even reaches RUNNING -- confirmed against a real submitted job still
    # sitting at "accepted" after 10+ minutes during testing, not a guess.
    # 30 minutes gives real queue delays room without polling forever.
    poll-timeout-ms: 1800000
