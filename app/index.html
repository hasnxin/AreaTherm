<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AreaTherm — Passive Shelter Thermal Design Platform</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AT</div>
        <div>
          <div class="brand-name" id="brandName">AreaTherm</div>
          <div class="brand-sub">Passive Shelter Design</div>
        </div>
        <button id="sidebarClose" class="sidebar-close" aria-label="Close menu">✕</button>
      </div>
      <nav class="nav" id="mainNav">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/guided" data-route="guided">Guided Setup</a>
        <a href="#/location" data-route="location">Location &amp; Climate</a>
        <a href="#/designer" data-route="designer">Shelter Designer</a>
        <a href="#/materials" data-route="materials">Materials</a>
        <a href="#/simulation" data-route="simulation">Thermal Simulation</a>
        <a href="#/optimization" data-route="optimization">Optimization</a>
        <a href="#/whatif" data-route="whatif">What-If Analysis</a>
        <a href="#/validation" data-route="validation">Validation</a>
        <a href="#/reports" data-route="reports">Reports</a>
        <a href="#/evaluator" data-route="evaluator">Evaluator Summary</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <div class="mode-toggle">
          <button id="modeSimple" class="mode-btn active">Simple</button>
          <button id="modeAdvanced" class="mode-btn">Advanced</button>
        </div>
        <div class="version-tag">thermal-engine v1.1.0</div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuToggle" class="menu-toggle" aria-label="Open menu">☰</button>
          <div class="topbar-project">
            <span class="topbar-label">Project</span>
            <span class="topbar-value" id="projectName">Untitled Project</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="runLiveDemoBtn" class="btn btn-accent">▶ Run Live Demo</button>
        </div>
      </header>
      <div class="view" id="viewRoot"><!-- rendered by app.js --></div>
    </main>
  </div>

  <div id="explainModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="explainTitle">Explain Calculation</h3>
        <button id="explainClose" class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="explainBody"></div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/reliability.js"></script>
  <script src="js/weather-api.js"></script>
  <script src="js/nasa-power.js"></script>
  <script src="js/elevation.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/export.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui-1.js"></script>
  <script src="js/ui-2.js"></script>
  <script src="js/ui-3.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
